[project]
name = "rpadi-video-tracking-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel Kunk", email = "daniel.kunk@colostate.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.1",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "scipy>=1.18.0",
    "tables>=3.11.1",
]

[project.scripts]
rpadi-video-tracking-analysis = "rpadi_video_tracking_analysis:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
